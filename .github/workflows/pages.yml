name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify repository integrity
        run: python3 scripts/verify_repo.py

      - name: Stage static site and evidence assets
        run: |
          rm -rf _site
          mkdir -p _site/evidence
          cp -R site/. _site/
          cp -R evidence/. _site/evidence/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/404.html
          test -f _site/favicon.ico
          test -f _site/robots.txt
          test -f _site/sitemap.xml
          test -f _site/mail/index.html
          test -f _site/memes/index.html
          test -f _site/story/index.html
          test -f _site/game/index.html
          test -f _site/receipts/x-2124825920808829077-temu3-code.webp
          test -f _site/evidence/00-cover-en.png

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
